<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🫧 Cyanobacteria Brasil - Mapa Interativo</title>
    
    <!-- Leaflet -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.1/MarkerCluster.min.css"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.1/MarkerCluster.Default.min.css"/>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f8fafc; }
        
        .container-main { display: grid; grid-template-columns: 1fr 360px; height: 100vh; }
        #map { grid-column: 1; background: #e8f4f8; }
        
        .sidebar { 
            grid-column: 2; 
            background: white; 
            border-left: 1px solid #e2e8f0;
            overflow-y: auto;
            box-shadow: -4px 0 6px rgba(0, 0, 0, 0.05);
        }
        
        .header {
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-bottom: 1px solid #ddd;
        }
        
        .header h1 { font-size: 18px; font-weight: 600; margin-bottom: 4px; }
        .header p { font-size: 12px; opacity: 0.9; }
        
        .section { padding: 16px; border-bottom: 1px solid #f1f5f9; }
        .section h3 { font-size: 12px; font-weight: 600; color: #333; margin-bottom: 12px; text-transform: uppercase; }
        
        .stat-row { display: flex; justify-content: space-between; margin-bottom: 10px; font-size: 13px; }
        .stat-label { color: #64748b; }
        .stat-value { font-weight: 600; color: #1e293b; }
        
        .color-dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; vertical-align: middle; }
        
        .filter-item { display: flex; align-items: center; margin-bottom: 10px; }
        .filter-item input { margin-right: 8px; }
        .filter-item label { font-size: 13px; cursor: pointer; flex: 1; }
        
        .input-search { 
            width: 100%; padding: 8px 12px; border: 1px solid #e2e8f0;
            border-radius: 6px; font-size: 12px;
        }
        
        .input-search:focus { outline: none; border-color: #667eea; box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1); }
        
        .info-box { font-size: 11px; line-height: 1.6; color: #64748b; }
        
        @media (max-width: 1024px) {
            .container-main { grid-template-columns: 1fr; }
            .sidebar { grid-column: 1; max-height: 30vh; border-left: none; border-top: 1px solid #e2e8f0; }
            #map { grid-column: 1; }
        }
    </style>
</head>
<body>
<div class="container-main">
    <div id="map"></div>
    
    <div class="sidebar">
        <div class="header">
            <h1>🫧 Cyanobacteria Brasil</h1>
            <p>Distribuição Geográfica Interativa</p>
        </div>
        
        <div class="section">
            <input type="text" id="search" class="input-search" placeholder="🔍 Buscar município...">
        </div>
        
        <div class="section">
            <h3>📊 Estatísticas</h3>
            <div class="stat-row">
                <span class="stat-label">Total de Bolhas:</span>
                <span class="stat-value">192</span>
            </div>
            <div class="stat-row">

            </div>
            <div class="stat-row">

            </div>
            <div class="stat-row">
                <span class="stat-label"><span class="color-dot" style="background:#FF6B35;"></span>Coccoid:</span>
                <span class="stat-value">45</span>
            </div>
            <div class="stat-row">
                <span class="stat-label"><span class="color-dot" style="background:#00A86B;"></span>Non-het:</span>
                <span class="stat-value">58</span>
            </div>
        </div>
        
        <div class="section">
            <h3>🎨 Filtros</h3>
            <div class="filter-item">
                <input type="checkbox" id="filter-het" checked>
                <label for="filter-het">Heterocytous</label>
            </div>
            <div class="filter-item">
                <input type="checkbox" id="filter-coc" checked>

            </div>
            <div class="filter-item">
                <input type="checkbox" id="filter-non" checked>
                <label for="filter-non">Non-heterocytous</label>
            </div>
        </div>
        
        <div class="section">
            <h3>ℹ️ Como Usar</h3>
            <div class="info-box">
                ✓ Scroll = zoom<br>
                ✓ Arrastar = pan<br>
                ✓ Clique = popup<br>
                ✓ Filtros dinâmicos<br>
                ✓ Busca de município
            </div>
        </div>
    </div>
</div>

// Iniciar mapa
const map = L.map('map').setView([-14, -51.9], 5);

// Tiles OpenStreetMap
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '© OpenStreetMap contributors',
    maxZoom: 19,
    zIndex: 1
}).addTo(map);

// Marker cluster group
const mcg = L.markerClusterGroup({
    maxClusterRadius: 80,
    disableClusteringAtZoom: 13,
    chunkedLoading: true
});

let marcadores = {};

// Adicionar marcadores
dados.forEach(m => {
    const raio = Math.log(m.freq + 1) * 3.5 + 5;
    
    const circle = L.circleMarker([m.lat, m.lon], {
        radius: raio,
        fillColor: m.color,
        color: 'white',
        weight: 2.5,
        opacity: 0.85,
        fillOpacity: 0.7,
        className: `tipo-${m.tipo}`
    });
    
    circle.bindPopup(`
        <div style="font-family: system-ui; font-size: 13px; min-width: 250px;">
            <h3 style="margin: 0 0 10px 0; color: ${m.color}; font-weight: 600; font-size: 16px;">
                🫧 ${m.municipio}
            </h3>
            <div style="border-top: 1px solid #e5e7eb; padding-top: 8px;">
                <div style="margin-bottom: 6px;"><b>Estado:</b> ${m.estado}</div>
                <div style="margin-bottom: 6px;">
                    <b style="color: ${m.color};">${m.tipo}</b>
                </div>
                <div style="margin-bottom: 6px;">
                    <b style="color: ${m.color}; font-size: 16px;">${m.freq} ocorrências</b>
                </div>
                <div style="font-size: 11px; color: #64748b; margin-top: 8px;">
                    Coords: (${m.lat.toFixed(4)}, ${m.lon.toFixed(4)})
                </div>
            </div>
        </div>
    `);
    
    circle.bindTooltip(`${m.municipio}: ${m.freq}`, { permanent: false, direction: 'top' });
    
    mcg.addLayer(circle);
    marcadores[m.municipio.toLowerCase()] = circle;
});

map.addLayer(mcg);

// Filtros
['filter-het', 'filter-coc', 'filter-non'].forEach(id => {
    document.getElementById(id).addEventListener('change', (e) => {
        const tipo = id.replace('filter-', '').charAt(0).toUpperCase() + 
                    id.replace('filter-', '').slice(1);
        const mapTipo = {
            'Het': 'Heterocytous',
            'Coc': 'Coccoid',
            'Non': 'Non-heterocytous'
        }[id.replace('filter-', '').toUpperCase()];
        
        document.querySelectorAll(`.tipo-${mapTipo}`).forEach(el => {
            el.style.display = e.target.checked ? 'block' : 'none';
        });
    });
});

// Busca
document.getElementById('search').addEventListener('input', (e) => {
    const term = e.target.value.toLowerCase();
    if (term.length > 0) {
        Object.keys(marcadores).forEach(key => {
            if (key.includes(term)) {
                const layer = marcadores[key];
                map.setView(layer.getLatLng(), 13);
                layer.openPopup();
            }
        });
    }
});
</script>
